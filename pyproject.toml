[project]
name = "strands-jev-example"
version = "0.1.0"
description = "Using TypeSafe's Jev decision model (via OpenRouter) as a harness around a Strands Agents agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.56.0",
    "strands-agents-tools>=0.8.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strands_jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
